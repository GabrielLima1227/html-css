<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.conteiner{
            display: flex;
            flex-flow: row no_wrap;
            background-color: lightsalmon;
        }
        div.item{
            flex-basis: 150px;
            text-align: center;
            border: 1px solid black;
            background-color: lightskyblue;
        }
        div#item_01{
            flex-grow: 0;
            flex-shrink: 1;
        }
        div#item_02{
            flex-grow: 2;
            flex-shrink: 0;
        }
        div#item_03{
            flex-grow: 1;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item"   id="item_01">A</div>
        <div class="item"   id="item_02">B</div>
        <div class="item"   id="item_03">C</div>
    </div>
</body>
</html>
