<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.conteiner{
            display: flex;
            flex-flow: row wrap;
            background-color: lightsalmon;
        }
        div.item{
            padding: 20px;
            text-align: center;
            border: 1px solid black;
            background-color: lightskyblue;
        }
        div#item_01{
            order: 0;
        }
        div#item_02{
            order: -2;
        }
        div#item_03{
            order: 4;
        }
        div#item_04{
            order: 8;
        }
        div#item_05{
            order: 2;
        }
        div#item_06{
            order: 0;
        }
        div#item_07{
            order: -4;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="item_01">A</div>
        <div class="item" id="item_02">B</div>
        <div class="item" id="item_03">C</div>
        <div class="item" id="item_04">D</div>
        <div class="item" id="item_05">E</div>
        <div class="item" id="item_06">F</div>
        <div class="item" id="item_07">G</div>
    </div>
</body>
</html>
