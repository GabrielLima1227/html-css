<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{
            height: 500px;
            width: 500px;
            border: 1px dashed black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <!--Tamanho padrão de um iframe 300x150-->
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scrolling="no"><a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a></iframe> 
        para aprender a progamar.</p>

    <!--Alguns Sites Tem Proteção Contra Iframes, Por Exemplo o site do Google.-->
    <p>O site do <iframe src="https://www.google.com.br" frameborder="0"></iframe> também é muito legal! Pena que não funciona dentro do iframe!</p>

    <p>O repositório do Guanabara 
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500px"><a href="https://gustavoguanabara.github.io">no Github</a></iframe>
        também é bem legal</p>
</body>
</html>
